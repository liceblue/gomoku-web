<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>五子棋（强AI/联网对战）</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- Socket.IO 客户端（联网对战用） -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title">五子棋 15×15</div>

      <div class="controls">
        <label class="lbl">
          模式
          <select id="mode">
            <option value="ai" selected>人机（强AI）</option>
            <option value="online">联网对战（房间号）</option>
          </select>
        </label>

        <label class="lbl">
          棋力
          <select id="level">
            <option value="0">简单</option>
            <option value="1">普通</option>
            <option value="2">困难</option>
            <option value="3" selected>超强</option>
            <option value="4">地狱</option>
          </select>
        </label>

        <span class="sep"></span>

        <label class="lbl">
          昵称
          <input id="name" placeholder="例如：iceblue" />
        </label>

        <button id="createRoom">创建房间</button>

        <label class="lbl">
          房间号
          <input id="roomId" placeholder="例如：A1B2C3" />
        </label>

        <button id="joinRoom">加入房间</button>

        <span class="sep"></span>

        <button id="undo">悔棋</button>
        <button id="restart">重开</button>
      </div>
    </header>

    <main class="main">
      <div class="boardWrap">
        <canvas id="board"></canvas>
      </div>

      <aside class="panel">
        <div class="status" id="status">准备开始：轮到你（黑）</div>
        <div class="hint">
          人机模式：你黑先，点击/触摸落子。<br/>
          联网模式：先创建房间把房间号发给朋友，或输入房间号加入。<br/>
          联网对局以服务器为裁判，会自动同步双方棋盘。<br/>
        </div>
      </aside>
    </main>
  </div>

  <script src="./gomoku.js"></script>
</body>
</html>
